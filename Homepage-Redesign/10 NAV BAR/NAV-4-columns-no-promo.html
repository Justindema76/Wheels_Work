<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wheels Nav Preview</title>
<!-- WHEELS · NAV BAR PREVIEW: 2 styles of the header + dropdown menu, filled with your real categories and subcategories (from wheelsauto.com/ca-en, Oct 14 2026).
     A = works with your current menu (WeltPixel Navigation Links) using CSS only.
     B = "Shop All Products" mega menu like the first design (no promo box on the right). Needs a developer to change the theme header. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://use.typekit.net/jiy5xhw.css"><!-- soleil: your site font (Adobe Fonts kit from wheelsauto.com) -->
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#d9161e;--red-d:#b30f16;--ink:#141414;--ink2:#2a2a2a;--muted:#6b6b6b;--line:#e6e6e6;--bg2:#f5f5f4}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:soleil,sans-serif;color:var(--ink);background:#fff;font-size:15px}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
.cond{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase}

/* preview switch (not part of the design) */
.pv{background:#fffbe6;border-bottom:1px solid #eadf9f;font-size:14px}
.pv .wrap{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;text-align:center;padding-top:10px;padding-bottom:10px}
.pv b{margin-right:4px}
.pv button{border:1px solid #c9bd76;background:#fff;border-radius:6px;padding:6px 12px;font-weight:600}
.pv button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.pv span{color:#6b5f1a;flex-basis:100%}

/* top bar */
.util{background:var(--ink);color:#cfcfcf;font-size:13.5px}
.util .wrap{display:flex;justify-content:center;align-items:center;height:36px;gap:8px;text-align:center}
.util b{color:#fff}
.util .code{background:var(--red);color:#fff;padding:2px 8px;border-radius:4px;font-weight:700}

/* header */
.head{background:#fff;border-bottom:1px solid var(--line)}
.head .wrap{display:flex;align-items:center;gap:24px;height:84px}
.logo img{display:block;height:52px;width:auto}
.search{flex:1;display:flex;max-width:560px;height:46px;border:2px solid var(--ink);border-radius:8px;overflow:hidden}
.search input{flex:1;border:0;padding:0 16px;font:inherit;font-size:15px;outline:0;min-width:0}
.search button{background:var(--red);color:#fff;width:54px;display:flex;align-items:center;justify-content:center}
.acts{margin-left:auto;display:flex;align-items:center;gap:22px;font-weight:600;font-size:14px;white-space:nowrap}
.acts .store{border:1px solid var(--line);border-radius:6px;padding:7px 10px}
.acts .cart{position:relative;display:flex}
.acts .cart i{position:absolute;top:-8px;right:-10px;background:var(--red);color:#fff;font-style:normal;font-size:11px;font-weight:700;border-radius:20px;min-width:19px;height:19px;display:flex;align-items:center;justify-content:center}
.burger{display:none}

/* ===== A: category bar + full-width dropdown ===== */
.navA{background:#fff;border-bottom:1px solid var(--line);position:relative}
.navA .bar{display:flex;align-items:stretch;justify-content:center;gap:6px;height:54px}
.navA .top{display:flex;align-items:center;justify-content:center;padding:0 12px;font-weight:400;font-size:14px;line-height:1.15;text-align:center;border-bottom:3px solid transparent;margin-bottom:-1px}
.navA .top.sale{color:var(--red)}
.navA .panel{position:absolute;left:0;right:0;top:100%;background:#fff;border-top:3px solid var(--red);box-shadow:0 22px 40px rgba(0,0,0,.14);display:none;z-index:20}
.navA .item.open .panel{display:block}
.navA .item.open .top{border-bottom-color:var(--red);color:var(--red)}
.navA .panel .wrap{display:grid;grid-template-columns:250px minmax(0,1fr);gap:36px;max-width:1240px;padding-top:28px;padding-bottom:30px}
.navA .intro{border-right:1px solid var(--line);padding-right:28px}
.navA .intro h3{font-size:30px;line-height:1;margin-bottom:12px}
.navA .intro p{color:var(--muted);font-size:14px;line-height:1.45;margin-bottom:18px}
.allbtn{display:inline-block;border-bottom:3px solid var(--red);font:800 17px/1 "Barlow Condensed";letter-spacing:.02em;text-transform:uppercase;padding-bottom:3px}
.navA .cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:26px 28px}
.navA .col h4{font-size:14px;font-weight:600;margin-bottom:9px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.navA .col li{list-style:none;padding:4px 0;font-size:13.5px;color:#3b3b3b}
.navA .col li.more a{color:var(--red);font-weight:600}

/* ===== B: Shop All mega menu ===== */
.navB{background:#fff;border-bottom:1px solid var(--line);position:relative}
.navB .bar{display:flex;align-items:stretch;justify-content:center;height:52px;gap:4px}
.shopall{display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;padding:0 20px;font-weight:600;font-size:14px}
.shopall.on{background:var(--red)}
.quick{display:flex;align-items:stretch;overflow:hidden}
.quick a{display:flex;align-items:center;padding:0 13px;font-weight:400;font-size:14px;white-space:nowrap;border-bottom:3px solid transparent}
.navB .right{display:flex;align-items:center}
.navB .right a{padding:0 12px;font-weight:600;font-size:14px}
.navB .right a.deal{color:var(--red)}
.mega{position:absolute;left:0;right:0;top:100%;background:#fff;box-shadow:0 22px 40px rgba(0,0,0,.14);border-top:3px solid var(--red);display:none;z-index:20}
.mega.open{display:block}
.mega .wrap{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:430px;max-width:1240px}
.mcats{border-right:1px solid var(--line);padding:12px 0}
.mcats button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:10px 18px 10px 0;font-weight:400;font-size:14px;color:var(--ink2)}
.mcats button.on{color:var(--red)}
.mcats button.on::after{content:"\203A";font-size:22px;line-height:1}
.msubs{padding:24px 34px}
.msubs .hd{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:18px}
.msubs h3{font-size:30px;line-height:1}
.msubs .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px 30px}
.msubs h4{font-size:14px;font-weight:600;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.msubs li{list-style:none;padding:3px 0;font-size:13.5px;color:#3b3b3b}
.mfeat{border-left:1px solid var(--line);padding:24px 0 24px 24px}
.promo{background:var(--red);color:#fff;border-radius:10px;padding:22px}
.promo small{font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:12px;opacity:.9}
.promo h5{font:800 34px/1 "Barlow Condensed";text-transform:uppercase;margin:8px 0 10px}
.promo p{font-size:14px;line-height:1.4;margin-bottom:16px}
.promo a{display:inline-block;background:#fff;color:var(--ink);font-weight:700;padding:9px 14px;border-radius:6px;font-size:14px}
.mfeat .help{margin-top:16px;font-size:14px;line-height:1.5;color:var(--muted)}
.mfeat .help b{color:var(--ink)}

@media (hover:hover){
  .search button:hover{background:var(--red-d)}
  .navA .top:hover{color:var(--red)}
  .navA .col h4 a:hover,.navA .col li a:hover,.msubs li a:hover,.msubs h4 a:hover{color:var(--red);text-decoration:underline}
  .allbtn:hover{color:var(--red);border-bottom-color:var(--ink)}
  .shopall:hover{background:var(--red)}
  .quick a:hover{border-bottom-color:var(--red)}
  .mcats button:hover{color:var(--red)}
  .promo a:hover{background:var(--ink);color:#fff}
}

/* ===== phones / tablets: one menu for both styles ===== */
.mob{display:none}
@media (max-width:1023px){
  .head .wrap{flex-wrap:wrap;height:auto;padding-top:12px;padding-bottom:12px;gap:12px}
  .logo img{height:40px}
  .burger{display:flex;align-items:center;justify-content:center;width:42px;height:42px;border:1px solid var(--line);border-radius:8px}
  .acts .store,.acts .acct{display:none}
  .search{order:5;flex-basis:100%;max-width:none}
  .navA,.navB{display:none}
  .mob.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50}
  .mob .sheet{background:#fff;width:min(88vw,380px);height:100%;overflow-y:auto}
  .mob .mh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:var(--ink);color:#fff;font-weight:700}
  .mob .mh button{color:#fff;font-size:26px;line-height:1}
  .mob details{border-bottom:1px solid var(--line)}
  .mob summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;font-weight:700;font-size:16px;cursor:pointer}
  .mob summary::-webkit-details-marker{display:none}
  .mob summary::after{content:"+";font-size:22px;color:var(--red);font-weight:600}
  .mob details[open] > summary::after{content:"\2212"}
  .mob details details summary{padding:11px 16px 11px 28px;font-size:15px;font-weight:600}
  .mob ul{padding:0 16px 10px 40px}
  .mob li{list-style:none;padding:7px 0;font-size:14.5px;color:#3b3b3b}
  .mob .all{display:block;padding:10px 16px 12px 28px;color:var(--red);font-weight:700}
  .mob .plain{display:block;padding:14px 16px;font-weight:700;font-size:16px;border-bottom:1px solid var(--line)}
  .mob .plain.sale{color:var(--red)}
}
@media (max-width:600px){
  .util .wrap{font-size:12.5px;height:auto;padding-top:7px;padding-bottom:7px}
}
</style>
</head>

/* B */
var mcats=document.getElementById('mcats'),msubs=document.getElementById('msubs'),hB='';
TREE.forEach(function(t,i){if(t.c.length)hB+='<button data-i="'+i+'">'+esc(t.n)+'</button>'});
mcats.innerHTML=hB;
function showB(i){
  var t=TREE[i],b=mcats.querySelectorAll('button'),h='';
  for(var j=0;j<b.length;j++)b[j].classList.toggle('on',+b[j].getAttribute('data-i')===i);
  h='<div class="hd"><h3 class="cond">'+esc(t.n)+'</h3><a class="allbtn" href="'+BASE+t.u+'">Shop all</a></div><div class="grid">';
  t.c.forEach(function(l1){h+='<div><h4><a href="'+BASE+l1.u+'">'+esc(l1.n)+'</a></h4><ul>'+listHTML(l1,6)+'</ul></div>'});
  msubs.innerHTML=h+'</div>';
}
mcats.addEventListener('mouseover',function(e){var b=e.target.closest('button');if(b)showB(+b.getAttribute('data-i'))});
mcats.addEventListener('click',function(e){var b=e.target.closest('button');if(b)showB(+b.getAttribute('data-i'))});
showB(0);
document.getElementById('quickB').innerHTML=['Flags & Banners','License & Name Plates','Mirror Tags & Hangers','Dealership Marketing'].map(function(n){var t=TREE.filter(function(x){return x.n===n})[0];return '<a href="'+BASE+t.u+'">'+esc(n)+'</a>'}).join('');
var mega=document.getElementById('mega'),shopall=document.getElementById('shopall');
shopall.addEventListener('click',function(){var o=mega.classList.toggle('open');shopall.classList.toggle('on',o)});
document.addEventListener('click',function(e){if(!e.target.closest('#navB')){mega.classList.remove('open');shopall.classList.remove('on')}});

/* phone menu */
var sh='<div class="mh">Shop All Products<button id="mclose" aria-label="Close">&times;</button></div>';
TREE.forEach(function(t){
  if(!t.c.length){sh+='<a class="plain'+(t.n==='On Sale Now'?' sale':'')+'" href="'+BASE+t.u+'">'+esc(t.n)+'</a>';return}
  sh+='<details><summary>'+esc(t.n)+'</summary><a class="all" href="'+BASE+t.u+'">Shop all '+esc(t.n)+'</a>';
  t.c.forEach(function(l1){sh+=l1.c.length?'<details><summary>'+esc(l1.n)+'</summary><ul>'+listHTML(l1,99)+'</ul></details>':'<a class="all" style="color:inherit;font-weight:600" href="'+BASE+l1.u+'">'+esc(l1.n)+'</a>'});
  sh+='</details>';
});
var mob=document.getElementById('mob');document.getElementById('sheet').innerHTML=sh;
document.getElementById('burger').addEventListener('click',function(){mob.classList.add('open')});
mob.addEventListener('click',function(e){if(e.target===mob||e.target.id==='mclose')mob.classList.remove('open')});

/* preview switch */
var notes={A:'Hover a category to open its dropdown. On a phone, tap the menu button. Style A can be done with CSS on your current menu.',B:'Click "Shop All Products" and hover the categories on the left. Style B needs a developer to change the theme header.'};
document.querySelectorAll('.pv button').forEach(function(b){b.addEventListener('click',function(){
  var s=b.getAttribute('data-style');
  document.querySelectorAll('.pv button').forEach(function(x){x.classList.toggle('on',x===b)});
  document.getElementById('navA').style.display=s==='A'?'':'none';
  document.getElementById('navB').style.display=s==='B'?'':'none';
  document.getElementById('pvNote').textContent=notes[s];
})});
document.getElementById('pvNote').textContent=notes.A;
</script>
</body>
</html>
