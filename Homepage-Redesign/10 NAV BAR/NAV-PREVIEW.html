<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wheels Nav Preview</title>
<!-- WHEELS · NAV BAR PREVIEW: header + dropdown menu, Home Depot style (clean single-column lists), filled with your real categories,
     subcategories and category photos (from wheelsauto.com/ca-en, Oct 14 2026).
     A = category bar: each category drops a panel (subcategory list | photo + items). Works with your current menu (WeltPixel Navigation Links) using CSS.
     B = "Shop All Products" button: categories | subcategories | photo + items. Needs a developer to change the theme header. -->
<link rel="stylesheet" href="https://use.typekit.net/jiy5xhw.css"><!-- soleil: your site font (Adobe Fonts kit from wheelsauto.com) -->
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#d9161e;--red-d:#b30f16;--ink:#141414;--ink2:#2a2a2a;--muted:#6b6b6b;--line:#e6e6e6;--bg2:#f5f5f4}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:soleil,sans-serif;color:var(--ink);background:#fff;font-size:15px}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
.cond{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase}

/* preview switch (not part of the design) */
.pv{background:#fffbe6;border-bottom:1px solid #eadf9f;font-size:14px}
.pv .wrap{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;text-align:center;padding-top:10px;padding-bottom:10px}
.pv button{border:1px solid #c9bd76;background:#fff;border-radius:6px;padding:6px 12px;font-weight:600}
.pv button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.pv span{color:#6b5f1a;flex-basis:100%}

/* top bar */
.util{background:var(--ink);color:#cfcfcf;font-size:13.5px}
.util .wrap{display:flex;justify-content:center;align-items:center;height:36px;gap:8px;text-align:center}
.util b{color:#fff}
.util .code{background:var(--red);color:#fff;padding:2px 8px;border-radius:4px;font-weight:700}

/* header */
.head{background:#fff;border-bottom:1px solid var(--line)}
.head .wrap{display:flex;align-items:center;gap:24px;height:84px}
.logo img{display:block;height:52px;width:auto}
.search{flex:1;display:flex;max-width:560px;height:46px;border:2px solid var(--ink);border-radius:8px;overflow:hidden}
.search input{flex:1;border:0;padding:0 16px;font:inherit;font-size:15px;outline:0;min-width:0}
.search button{background:var(--red);color:#fff;width:54px;display:flex;align-items:center;justify-content:center}
.acts{margin-left:auto;display:flex;align-items:center;gap:22px;font-weight:600;font-size:14px;white-space:nowrap}
.acts .store{border:1px solid var(--line);border-radius:6px;padding:7px 10px}
.acts .cart{position:relative;display:flex}
.acts .cart i{position:absolute;top:-8px;right:-10px;background:var(--red);color:#fff;font-style:normal;font-size:11px;font-weight:700;border-radius:20px;min-width:19px;height:19px;display:flex;align-items:center;justify-content:center}
.burger{display:none}

/* ===== nav bars ===== */
nav.bar{background:#fff;border-bottom:1px solid var(--line);position:relative;z-index:30}
nav.bar .row{display:flex;align-items:stretch;justify-content:center;height:54px;position:relative}
.dim{position:absolute;left:0;right:0;top:100%;height:100vh;background:rgba(0,0,0,.38);display:none;z-index:-1}
nav.bar.open .dim{display:block}

/* A: category links */
.topA{display:flex;align-items:center;justify-content:center;text-align:center;padding:0 12px;font-size:14px;line-height:1.15;border-bottom:3px solid transparent;margin-bottom:-1px}
.topA.sale{color:var(--red)}
.topA.on{border-bottom-color:var(--red);color:var(--red)}

/* B: button + quick links */
.shopall{display:flex;align-items:center;gap:10px;padding:0 18px;font-weight:600;font-size:15px;border-bottom:3px solid transparent;margin-bottom:-1px}
.shopall .car{transition:transform .15s}
.shopall.on{border-bottom-color:var(--red)}
.shopall.on .car{transform:rotate(180deg)}
.quick{display:flex;align-items:stretch}
.quick a{display:flex;align-items:center;padding:0 14px;font-size:14px;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px}
.quick a.sale{color:var(--red);font-weight:600}

/* dropdown panel (both styles) */
.dd{position:absolute;top:100%;background:#fff;box-shadow:0 18px 36px rgba(0,0,0,.18);display:none;max-height:calc(100vh - 230px);min-height:420px}
nav.bar.open .dd{display:flex}
.pane{width:310px;padding:14px 0;overflow-y:auto;border-right:1px solid var(--line)}
.pane:last-child{border-right:0}
.pane h5{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:6px 22px 10px;font-size:16px;font-weight:700}
.pane h5 a.all{font-size:13.5px;font-weight:600;color:var(--red);text-decoration:underline;white-space:nowrap}
.pane .it{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 22px;font-size:14px;color:var(--ink2);line-height:1.3}
.pane .it::after{content:"";flex:none;width:7px;height:7px;border-right:1.6px solid #777;border-top:1.6px solid #777;transform:rotate(45deg)}
.pane .it.leaf::after{display:none}
.pane .it.on{background:var(--bg2);color:var(--ink)}
.pane.pic{width:340px;padding:16px 18px}
.pic .ph{display:block;background:var(--bg2);aspect-ratio:4/3;overflow:hidden}
.pic .ph img{width:100%;height:100%;object-fit:cover;display:block}
.pic .ph.logo img{object-fit:contain;padding:30px}
.pic h6{font-size:15px;font-weight:700;margin:14px 0 6px}
.pic ul{list-style:none}
.pic li a{display:block;padding:6px 0;font-size:14px;color:var(--ink2)}
.pic .all2{display:inline-block;margin-top:10px;font-size:13.5px;font-weight:600;color:var(--red);text-decoration:underline}

@media (hover:hover){
  .search button:hover{background:var(--red-d)}
  .topA:hover,.quick a:hover{color:var(--red)}
  .shopall:hover{color:var(--red)}
  .pane .it:hover{background:var(--bg2);color:var(--ink)}
  .pic li a:hover,.pane h5 a:hover{color:var(--red);text-decoration:underline}
}

/* ===== phones / tablets ===== */
.mob{display:none}
@media (max-width:1023px){
  .head .wrap{flex-wrap:wrap;height:auto;padding-top:12px;padding-bottom:12px;gap:12px}
  .logo img{height:40px}
  .burger{display:flex;align-items:center;justify-content:center;width:42px;height:42px;border:1px solid var(--line);border-radius:8px}
  .acts .store,.acts .acct{display:none}
  .search{order:5;flex-basis:100%;max-width:none}
  nav.bar{display:none !important}
  .mob.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50}
  .mob .sheet{background:#fff;width:min(88vw,380px);height:100%;overflow-y:auto}
  .mob .mh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:var(--ink);color:#fff;font-weight:700}
  .mob .mh button{color:#fff;font-size:26px;line-height:1}
  .mob details{border-bottom:1px solid var(--line)}
  .mob summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;font-weight:600;font-size:15.5px;cursor:pointer}
  .mob summary::-webkit-details-marker{display:none}
  .mob summary::after{content:"+";font-size:22px;color:var(--red);font-weight:600}
  .mob details[open] > summary::after{content:"\2212"}
  .mob details details summary{padding:11px 16px 11px 28px;font-size:14.5px;font-weight:400}
  .mob ul{padding:0 16px 10px 40px}
  .mob li{list-style:none;padding:7px 0;font-size:14px;color:#3b3b3b}
  .mob .all{display:block;padding:10px 16px 12px 28px;color:var(--red);font-weight:600}
  .mob .plain{display:block;padding:14px 16px;font-weight:600;font-size:15.5px;border-bottom:1px solid var(--line)}
  .mob .plain.sale{color:var(--red)}
}
@media (max-width:600px){.util .wrap{font-size:12.5px;height:auto;padding-top:7px;padding-bottom:7px}}
</style>
</head>

function drawB(i,j){
  var h='<div class="pane cats"><h5>Shop by Category</h5>';
  TREE.forEach(function(t,k){if(t.c.length)h+='<a class="it'+(k===i?' on':'')+'" data-i="'+k+'" href="'+BASE+t.u+'">'+esc(t.n)+'</a>'});
  h+='</div>'+subPane(TREE[i],j)+picPane(TREE[i],j);
  ddB.innerHTML=h;
  ddB.querySelectorAll('.cats .it').forEach(function(a){a.addEventListener('mouseenter',function(){drawB(+a.getAttribute('data-i'),0)})});
  wireSubs(ddB,TREE[i],function(jj){drawB(i,jj)});
}
shopall.addEventListener('click',function(){
  var o=!navB.classList.contains('open');navB.classList.toggle('open',o);shopall.classList.toggle('on',o);
  if(o){drawB(0,0);ddB.style.left=Math.max(20,shopall.offsetLeft)+'px'}
});
navB.querySelector('.dim').addEventListener('click',function(){navB.classList.remove('open');shopall.classList.remove('on')});

/* ===== phone menu ===== */
var sh='<div class="mh">Shop All Products<button id="mclose" aria-label="Close">&times;</button></div>';
TREE.forEach(function(t){
  if(!t.c.length){sh+='<a class="plain'+(t.n==='On Sale Now'?' sale':'')+'" href="'+BASE+t.u+'">'+esc(t.n)+'</a>';return}
  sh+='<details><summary>'+esc(t.n)+'</summary><a class="all" href="'+BASE+t.u+'">Shop all '+esc(t.n)+'</a>';
  t.c.forEach(function(l1){
    if(!l1.c.length){sh+='<a class="all" style="color:inherit;font-weight:400" href="'+BASE+l1.u+'">'+esc(l1.n)+'</a>';return}
    sh+='<details><summary>'+esc(l1.n)+'</summary><ul>';l1.c.forEach(function(x){sh+='<li><a href="'+BASE+l1.u+'">'+esc(x)+'</a></li>'});sh+='</ul></details>';
  });
  sh+='</details>';
});
var mob=document.getElementById('mob');document.getElementById('sheet').innerHTML=sh;
document.getElementById('burger').addEventListener('click',function(){mob.classList.add('open')});
mob.addEventListener('click',function(e){if(e.target===mob||e.target.id==='mclose')mob.classList.remove('open')});

/* ===== preview switch ===== */
var notes={A:'Hover a category. Then hover a subcategory to see its photo and items. On a phone, tap the menu button.',B:'Click "Shop All Products", hover a category on the left, then a subcategory in the middle.'};
document.querySelectorAll('.pv button').forEach(function(b){b.addEventListener('click',function(){
  var s=b.getAttribute('data-style');
  document.querySelectorAll('.pv button').forEach(function(x){x.classList.toggle('on',x===b)});
  navA.style.display=s==='A'?'':'none';navB.style.display=s==='B'?'':'none';
  closeA();navB.classList.remove('open');shopall.classList.remove('on');
  document.getElementById('pvNote').textContent=notes[s];
})});
document.getElementById('pvNote').textContent=notes.A;
</script>
</body>
</html>
