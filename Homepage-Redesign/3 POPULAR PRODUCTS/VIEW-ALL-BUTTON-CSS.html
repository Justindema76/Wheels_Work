<!-- ===== WHEELS · "VIEW ALL" BUTTONS (bold underline: black text + red line, hover red text + black line) =====
     Styles the Page Builder buttons on the homepage that sit on their own under a section
     (View All under Popular Products, On Sale Now, etc.). Buttons inside cards/columns are NOT touched.
     Paste at the end of your Site Styles HTML Code element (or any HTML Code element on the homepage).

     FRENCH: next to each English Buttons element add a French one ("Voir tout", same link) and give them
     CSS classes (Advanced → CSS Classes):  lang-en  on the English one,  lang-fr  on the French one. -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800&display=swap');
/* VIEW ALL: bold black text, red underline. Hover: red text, black underline */
.cms-index-index [data-content-type="buttons"]:not([data-content-type="column"] [data-content-type="buttons"]) .pagebuilder-button-primary,
.cms-index-index [data-content-type="buttons"]:not([data-content-type="column"] [data-content-type="buttons"]) .pagebuilder-button-secondary{
  display:inline-block !important;width:auto !important;min-width:0 !important;height:auto !important;min-height:0 !important;margin:0 !important;
  padding:0 0 3px !important;background:none !important;border:0 !important;border-bottom:3px solid #d9161e !important;border-radius:0 !important;box-shadow:none !important;
  color:#141414 !important;font:800 20px/1 "Barlow Condensed",Barlow,system-ui,sans-serif !important;letter-spacing:.02em !important;text-transform:uppercase !important;text-decoration:none !important;
  transition:color .15s,border-color .15s !important}
.cms-index-index [data-content-type="buttons"]:not([data-content-type="column"] [data-content-type="buttons"]) .pagebuilder-button-primary span,
.cms-index-index [data-content-type="buttons"]:not([data-content-type="column"] [data-content-type="buttons"]) .pagebuilder-button-secondary span{color:inherit !important;font:inherit !important;letter-spacing:inherit !important;text-transform:inherit !important}
@media(hover:hover){
  .cms-index-index [data-content-type="buttons"]:not([data-content-type="column"] [data-content-type="buttons"]) .pagebuilder-button-primary:hover,
  .cms-index-index [data-content-type="buttons"]:not([data-content-type="column"] [data-content-type="buttons"]) .pagebuilder-button-secondary:hover{color:#d9161e !important;border-bottom-color:#141414 !important;background:none !important}
}

/* LANGUAGE / SITE SWITCH (English on ca-en + us, French on ca-fr) */
html[lang^="fr"] .lang-en.lang-en.lang-en.lang-en,html[lang^="fr"] .lang-ca.lang-ca.lang-ca.lang-ca,html[lang^="fr"] .lang-us.lang-us.lang-us.lang-us{display:none !important}
html:not([lang^="fr"]) .lang-fr.lang-fr.lang-fr.lang-fr{display:none !important}
html.wstore-ca-en .lang-us.lang-us.lang-us.lang-us{display:none !important}
html.wstore-us .lang-ca.lang-ca.lang-ca.lang-ca{display:none !important}
</style>
<script>
(function(){var h=document.documentElement,m=location.pathname.match(/^\/(ca-en|ca-fr|us)(\/|$)/);
  var st=m?m[1]:((h.lang||'').indexOf('fr')===0?'ca-fr':'ca-en');h.classList.add('wstore-'+st);})();
</script>
