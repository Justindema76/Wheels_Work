<!-- ===== WHEELS · BLOCK 2 · SHOP BY CATEGORY — PAGE BUILDER VERSION =====
     Paste this into the HTML Code element at the top of the row (replaces the old <style> one).
     Then give each Page Builder piece these CSS classes (Advanced → CSS Classes):

       Columns (the group) ...................... wcat-grid
       Column 1  Dealership Marketing ........... wcat-card wcat-i-marketing
       Column 2  Vehicle Advertising & Display .. wcat-card wcat-i-vehicle
       Column 3  Flags & Banners ................ wcat-card wcat-i-flags
       Column 4  License & Nameplates ........... wcat-card wcat-i-plates
       Column 5  Showroom Marketing & Displays .. wcat-card wcat-i-showroom
       Column 6  Outdoor Display Solutions ...... wcat-card wcat-i-outdoor
       Column 7  Mirror Tags & Hanger Signs ..... wcat-card wcat-i-tags
       Column 8  Service & Lot Solutions ........ wcat-card wcat-i-service
       (2 Columns rows of 5 — both get wcat-grid)
       Column 9  OEM Programs ................... wcat-card wcat-i-oem
       Column 10 Browse the full catalogue ...... wcat-card wcat-all

     The photo in each column is hidden (you can leave it or delete it).
     The "View All" button stays — it becomes invisible and covers the whole card,
     so clicking anywhere on the card goes to the category the button is linked to. -->
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
<style>
/* heading */
.wcat-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:0 0 18px;font-family:Barlow,system-ui,sans-serif}
.wcat-head h2{font-family:"Barlow Condensed",Barlow,sans-serif !important;font-weight:800 !important;text-transform:uppercase;font-size:34px !important;line-height:1 !important;color:#141414 !important;margin:0 !important;letter-spacing:.01em}
.wcat-head a,.wcat-head a:visited{font-weight:700;font-size:14.5px;color:#d9161e !important;text-decoration:none !important;white-space:nowrap}

/* the grid (Columns element, class wcat-grid) */
.wcat-grid,.wcat-grid .pagebuilder-column-line{margin:0 !important;padding:0 !important;width:100% !important}
.wcat-grid .pagebuilder-column-line{display:grid !important;grid-template-columns:repeat(5,minmax(0,1fr)) !important;gap:12px !important}
.wcat-grid ~ .wcat-grid{margin-top:12px !important}

/* each card (Column element, class wcat-card) */
.wcat-grid .wcat-card{position:relative !important;display:flex !important;flex-direction:column !important;justify-content:space-between !important;gap:16px !important;
  width:auto !important;max-width:none !important;min-width:0 !important;flex:none !important;min-height:132px !important;height:auto !important;
  margin:0 !important;padding:16px !important;background:#f5f5f4 !important;border:1px solid #ececea !important;border-radius:10px !important;
  box-shadow:none !important;transition:border-color .15s,transform .15s,box-shadow .15s !important;font-family:Barlow,system-ui,sans-serif}
.wcat-grid .wcat-card:hover{border-color:#141414 !important;transform:translateY(-2px);box-shadow:0 8px 18px rgba(0,0,0,.06) !important}

/* red icon, drawn by CSS */
.wcat-grid .wcat-card::before{content:"";display:block;width:36px;height:36px;flex:none;background:#d9161e;-webkit-mask:var(--wcat-ico) center/contain no-repeat;mask:var(--wcat-ico) center/contain no-repeat}

/* hide the photo */
.wcat-grid .wcat-card figure,.wcat-grid .wcat-card [data-content-type="image"]{display:none !important}

/* title (Text element) — overrides the red/centered inline styles */
.wcat-grid .wcat-card [data-content-type="text"]{margin:0 !important;padding:0 !important}
.wcat-grid .wcat-card [data-content-type="text"] p,
.wcat-grid .wcat-card [data-content-type="text"] span,
.wcat-grid .wcat-card [data-content-type="text"] a{text-align:left !important;color:#141414 !important;font-size:14.5px !important;font-weight:700 !important;line-height:1.2 !important;text-transform:none !important;text-decoration:none !important;margin:0 !important;height:auto !important;display:inline !important}
.wcat-grid .wcat-card [data-content-type="text"] p{display:block !important}

/* "View All" button → invisible, covers the whole card */
.wcat-grid .wcat-card [data-content-type="buttons"]{position:static !important;margin:0 !important}
.wcat-grid .wcat-card .pagebuilder-button-primary,
.wcat-grid .wcat-card [data-content-type="button-item"] a{position:absolute !important;inset:0 !important;z-index:2 !important;width:auto !important;height:auto !important;margin:0 !important;padding:0 !important;opacity:0 !important;border:0 !important;background:none !important}

/* phones: all 10 cards 2-across in 5 even rows, flowing through both Columns rows.
   Plain floats only (no :has, no display:contents, no grid tricks — Safari-safe).
   The small script below adds "wcat-row" to the Row that holds the two Columns. */
@media(max-width:760px){
  .wcat-head h2{font-size:28px !important}
  .wcat-head a{display:none !important}
  .wcat-row{display:block !important}
  .wcat-row::after{content:"";display:block;clear:both}
  .wcat-grid,.wcat-grid .pagebuilder-column-line{display:block !important;overflow:visible !important;height:auto !important;min-height:0 !important}
  .wcat-grid ~ .wcat-grid{margin-top:0 !important}
  .wcat-grid .wcat-card{float:left !important;box-sizing:border-box !important;width:calc(50% - 5px) !important;height:124px !important;min-height:0 !important;margin:0 0 10px !important;padding:13px !important;gap:10px !important;overflow:hidden !important;transform:none !important}
  /* right-hand cards: 2nd and 4th of the first row, 1st, 3rd and 5th of the second */
  .wcat-grid .wcat-card:nth-child(even),
  .wcat-grid ~ .wcat-grid .wcat-card:nth-child(odd){float:right !important}
  .wcat-grid ~ .wcat-grid .wcat-card:nth-child(even){float:left !important}
  .wcat-grid .wcat-card::before{width:28px;height:28px}
  .wcat-grid .wcat-card [data-content-type="text"] p,.wcat-grid .wcat-card [data-content-type="text"] span,.wcat-grid .wcat-card [data-content-type="text"] a{font-size:14px !important}
  .wcat-grid .wcat-card.wcat-all [data-content-type="text"] p,.wcat-grid .wcat-card.wcat-all [data-content-type="text"] span,.wcat-grid .wcat-card.wcat-all [data-content-type="text"] a{font-size:17px !important}
}
/* small phones (iPhone SE / mini): a little taller so 3-line titles fit */
@media(max-width:359px){
  .wcat-grid .wcat-card{height:138px !important}
}
</style>
<script>
(function(){
  function wcatRow(){var g=document.querySelectorAll('.wcat-grid');for(var i=0;i<g.length;i++){if(g[i].parentNode&&g[i].parentNode.classList)g[i].parentNode.classList.add('wcat-row');}}
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',wcatRow);}else{wcatRow();}
})();
</script>
