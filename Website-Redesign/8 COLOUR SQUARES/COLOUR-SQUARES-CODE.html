<!-- WHEELS HOMEPAGE · 8 COLOUR SQUARES "Shop more at Wheels" · CODE: 6 squares (English + French). Goes in: the HTML Code element in the coloured-sales-squares block. Repo file: Website-Redesign/8 COLOUR SQUARES/COLOUR-SQUARES-CODE.html -->
<!-- ===== WHEELS · COLOUR SQUARES ("Shop more at Wheels") — PAGE BUILDER VERSION =====
     6 colour squares. Each one links to whatever you pick (Category, product, page or URL).
     Paste this whole file into an HTML Code element in the same Row, above the Columns.
     (Change the heading text at the very bottom of this file: English line + French line.)

     PAGE BUILDER SETUP (Advanced → CSS Classes):
       Columns (6 columns) ........ wsq
       Each Column ................ wsq-card + a colour:
            wsq-charcoal   wsq-red   wsq-lime   wsq-black   wsq-white   wsq-maroon
         optional icon on top ..... wsq-i-NAME   (flag, oem, tag, gift, car, key, star, percent, sparkle, folio, card)
         e.g.  wsq-card wsq-black wsq-i-flag
         bigger text (short words like SAVE 10% ON 10) ... add wsq-xl

     INSIDE EACH COLUMN:
       1. Text element = the square. Each line is its own line (press ENTER).
          Pick the size from the editor's "Paragraph" dropdown:
              Heading 2 ...... BIG line        (ARRIVED, NUMBERS, SEASON)
              Heading 3 ...... medium line     (JUST, SALE EVENT, UNDER $10)
              Heading 4 ...... red tag         (DEALS)
              Paragraph ...... small line      (New this month)
          Type in any colour/size — the CSS sets them.
       2. Buttons element = the red link under the square ("Deals Under $10").
          Link → Category. The › is added for you. Clicking the square works too.
     LANGUAGES (one block for all 3 sites — no copies):
       Put the English AND the French in the same column, and give each element
       a CSS class (Advanced → CSS Classes on that Text / Buttons element):
            lang-en ... English  → shows on ca-en and us
            lang-fr ... French   → shows on ca-fr only
            lang-ca ... Canada English only (ca-en)    use these two instead of lang-en
            lang-us ... USA only (us)                   when the US wording is different
       No class = shows on every site.
       So each column has: Text (lang-en) + Text (lang-fr) + Buttons (lang-en) + Buttons (lang-fr).
     Desktop 6 across · tablets 3 across · phones 2 across (3 even rows). -->
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
<style>

.wsq .pagebuilder-column-line{display:grid !important;grid-template-columns:repeat(6,minmax(0,1fr)) !important;gap:16px !important}

  margin:0 !important;padding:0 !important;background:none !important;border:0 !important;box-shadow:none !important;

/* the square (Text element) */

.wsq .wsq-card [data-content-type="text"] *{color:inherit !important;font:inherit !important;text-transform:inherit !important;letter-spacing:inherit !important;text-decoration:none !important;text-align:center !important;background:none !important;margin:0 !important;padding:0 !important}
.wsq .wsq-card [data-content-type="text"] h2,.wsq .wsq-card [data-content-type="text"] h3,.wsq .wsq-card [data-content-type="text"] h4,.wsq .wsq-card [data-content-type="text"] p{display:block !important;max-width:100% !important;margin:0 !important;padding:0 !important;color:var(--wsq-ink) !important;text-align:center !important;border:0 !important}
.wsq .wsq-card [data-content-type="text"] h2{font:800 var(--wsq-big)/.95 "Barlow Condensed",Barlow,sans-serif !important;text-transform:uppercase !important;letter-spacing:0 !important}
.wsq .wsq-card [data-content-type="text"] h3{font:800 var(--wsq-mid)/1 "Barlow Condensed",Barlow,sans-serif !important;text-transform:uppercase !important;letter-spacing:.01em !important}
.wsq .wsq-card [data-content-type="text"] p{font:600 var(--wsq-small)/1.25 Barlow,system-ui,sans-serif !important;text-transform:none !important;margin-top:6px !important;opacity:.92}
/* red tag (Heading 4) */
.wsq .wsq-card [data-content-type="text"] h4{display:inline-block !important;margin:4px 0 !important;padding:5px 20px 5px 16px !important;background:var(--wsq-tag) !important;color:#fff !important;
  font:800 calc(var(--wsq-mid)*.95)/1 "Barlow Condensed",Barlow,sans-serif !important;text-transform:uppercase !important;
  -webkit-clip-path:polygon(0 0,90% 0,100% 50%,90% 100%,0 100%,5% 50%);clip-path:polygon(0 0,90% 0,100% 50%,90% 100%,0 100%,5% 50%)}

.wsq .wsq-card[class*="wsq-i-"] [data-content-type="text"]::before{content:"";display:block;flex:none;width:44px;height:44px;margin:0 0 8px;background:var(--wsq-icon);-webkit-mask:var(--wsq-ico) center/contain no-repeat;mask:var(--wsq-ico) center/contain no-repeat}

/* the red link under the square (Buttons element) — the whole tile is clickable */
.wsq .wsq-card [data-content-type="buttons"]{position:static !important;display:block !important;margin:10px 0 0 !important;padding:0 !important;text-align:center !important}
.wsq .wsq-card [data-content-type="button-item"]{position:static !important;display:block !important;margin:0 !important}
.wsq .wsq-card [data-content-type="button-item"] a,.wsq .wsq-card .pagebuilder-button-primary,.wsq .wsq-card .pagebuilder-button-secondary,.wsq .wsq-card .pagebuilder-button-link{

  background:none !important;border:0 !important;border-radius:0 !important;box-shadow:none !important;
  color:#d9161e !important;font:700 14.5px/1.3 Barlow,system-ui,sans-serif !important;text-transform:none !important;letter-spacing:0 !important;text-decoration:none !important}
.wsq .wsq-card [data-content-type="button-item"] a span{color:inherit !important;font:inherit !important}
.wsq .wsq-card [data-content-type="button-item"] a span::after{content:" \203A"}
.wsq .wsq-card [data-content-type="button-item"] a::before{content:"";position:absolute;inset:0;z-index:2}
@media(hover:hover){
  .wsq .wsq-card:hover [data-content-type="text"]{box-shadow:0 10px 22px rgba(0,0,0,.16) !important}
  .wsq .wsq-card:hover [data-content-type="button-item"] a{text-decoration:underline !important}
}

<script>

(function(){var h=document.documentElement,m=location.pathname.match(/^\/(ca-en|ca-fr|us)(\/|$)/);

</script>
